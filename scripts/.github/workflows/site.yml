name: Menus and site

on:
  schedule:
    - cron: "17 1 * * *"   # about 8:17 PM Galesburg time (7:17 PM in winter)
    - cron: "17 11 * * *"  # about 6:17 AM, catches same-day menu changes
  push:
    branches: [main]
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  menus:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch café menus
        run: node scripts/fetch-menus.mjs
      - name: Save new menus
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menus
          git diff --cached --quiet || git commit -m "Update menus $(date -u +%F)"
          git push

  deploy:
    needs: menus
    if: always() && (needs.menus.result == 'success' || needs.menus.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages
        uses: actions/deploy-pages@v4
